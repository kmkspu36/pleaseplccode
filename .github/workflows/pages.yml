name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate config.js from secrets
        env:
          BROKER_URL: ${{ secrets.BROKER_URL }}
          SEALED: ${{ secrets.SEALED }}
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          node -e 'require("fs").writeFileSync("_site/config.js","window.PANELLAB_CONFIG = "+JSON.stringify({BROKER_URL:process.env.BROKER_URL,SEALED:process.env.SEALED})+";\n")'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
